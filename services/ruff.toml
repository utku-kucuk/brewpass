line-length = 100
target-version = "py312"
# Autogenerated migrations are reviewed by hand but not reformatted.
extend-exclude = ["*/alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[lint.isort]
known-third-party = ["alembic"]
known-first-party = [
    "brewpass_common",
    "auth_service",
    "catalog_service",
    "commerce_service",
    "payment_service",
]
