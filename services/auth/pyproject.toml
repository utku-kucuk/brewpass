[project]
name = "brewpass-auth-service"
version = "0.1.0"
description = "BrewPass auth service: phone OTP sign-in, tokens and user profiles"
requires-python = ">=3.12"
dependencies = [
    "brewpass-common",
    "email-validator>=2.2,<3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auth_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
