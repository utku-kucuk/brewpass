[project]
name = "brewpass-catalog-service"
version = "0.1.0"
description = "BrewPass catalog service: partner shops, opening hours, menus and location search"
requires-python = ">=3.12"
dependencies = [
    "brewpass-common",
    "geoalchemy2>=0.17,<1.0",
    # IANA time zones for "open now" (slim images ship without the system database).
    "tzdata>=2024.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catalog_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
