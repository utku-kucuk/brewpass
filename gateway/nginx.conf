# API gateway: the single entry point for clients. Routes /api/v1/* to the owning service.
# /internal/* routes are deliberately not exposed.

# Resolve service names through Docker's DNS on every request (cached 10s) instead of once at
# startup, so recreated containers with new IPs are picked up without restarting the gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep a caller-supplied request id, otherwise generate one; services log it on every line.
map $http_x_request_id $brewpass_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $brewpass_request_id;
    # Never let clients reach internal routes by forging the header.
    proxy_set_header X-Internal-Token "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    default_type application/json;

    location = /health {
        return 200 '{"success":true,"data":{"service":"gateway","status":"ok"},"error":null}';
    }

    # Per-service health: /health/auth, /health/catalog, ...
    location ~ ^/health/(auth|catalog|commerce|payment)$ {
        set $service $1;
        proxy_pass http://$service:8000/health;
    }

    # Per-service API docs: /api/v1/docs/auth, /api/v1/docs/catalog, ...
    # (proxy_pass with a variable and no path forwards the original URI.)
    location ~ ^/api/v1/docs/(auth|catalog|commerce|payment)(/.*)?$ {
        set $service $1;
        proxy_pass http://$service:8000;
    }

    location /api/v1/auth/         { set $service auth;     proxy_pass http://$service:8000; }
    location /api/v1/users/        { set $service auth;     proxy_pass http://$service:8000; }
    location /api/v1/shops         { set $service catalog;  proxy_pass http://$service:8000; }
    location /api/v1/subscriptions { set $service commerce; proxy_pass http://$service:8000; }
    location /api/v1/orders        { set $service commerce; proxy_pass http://$service:8000; }
    location /api/v1/payments      { set $service payment;  proxy_pass http://$service:8000; }

    location / {
        return 404 '{"success":false,"data":null,"error":{"code":"NOT_FOUND","message":"Not Found","details":null}}';
    }
}
