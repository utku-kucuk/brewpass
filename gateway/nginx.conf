# API gateway: the single entry point for clients. Routes /api/v1/* to the owning service.
# /internal/* routes are deliberately not exposed.

upstream auth     { server auth:8000; }
upstream catalog  { server catalog:8000; }
upstream commerce { server commerce:8000; }
upstream payment  { server payment:8000; }

# Keep a caller-supplied request id, otherwise generate one; services log it on every line.
map $http_x_request_id $brewpass_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $brewpass_request_id;
    # Never let clients reach internal routes by forging the header.
    proxy_set_header X-Internal-Token "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    default_type application/json;

    location = /health {
        return 200 '{"success":true,"data":{"service":"gateway","status":"ok"},"error":null}';
    }

    # Per-service health: /health/auth, /health/catalog, ...
    location ~ ^/health/(auth|catalog|commerce|payment)$ {
        proxy_pass http://$1/health;
    }

    # Per-service API docs: /api/v1/docs/auth, /api/v1/docs/catalog, ...
    location ~ ^/api/v1/docs/(auth|catalog|commerce|payment)(/.*)?$ {
        proxy_pass http://$1;
    }

    location /api/v1/auth/          { proxy_pass http://auth; }
    location /api/v1/users/         { proxy_pass http://auth; }
    location /api/v1/shops          { proxy_pass http://catalog; }
    location /api/v1/subscriptions  { proxy_pass http://commerce; }
    location /api/v1/orders         { proxy_pass http://commerce; }
    location /api/v1/payments       { proxy_pass http://payment; }

    location / {
        return 404 '{"success":false,"data":null,"error":{"code":"NOT_FOUND","message":"Not Found","details":null}}';
    }
}
